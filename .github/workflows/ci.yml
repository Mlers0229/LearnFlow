name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Java 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg15
        env:
          POSTGRES_DB: learnflow_ci
          POSTGRES_USER: learnflow_ci
          POSTGRES_PASSWORD: learnflow_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnflow_ci -d learnflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Validate application and observability Compose profiles
        run: docker compose -f ../docker-compose.yml --profile observability config
      - name: Validate deployment and Flyway contracts
        run: |
          python ../tools/check_deployment_assets.py
          python ../tools/check_flyway_contract.py
      - name: Validate performance, capacity and recovery contracts
        run: |
          python ../tools/check_performance_assets.py
          python ../tools/check_recovery_assets.py
          python ../tools/check_data_governance_assets.py
          python -m unittest discover -s ../tools/tests -p "test_*.py"
      - name: Validate observability rules and provisioned assets
        run: |
          python ../tools/check_observability_assets.py
          docker run --rm --entrypoint /bin/promtool -v "${{ github.workspace }}/ops/observability/prometheus:/etc/prometheus:ro" prom/prometheus:v3.14.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/amtool -v "${{ github.workspace }}/ops/observability/alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.34.0 check-config /etc/alertmanager/alertmanager.yml
      - name: Compile and test
        run: mvn --batch-mode --no-transfer-progress test
      - name: Package application
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Verify Flyway migrations and JPA mappings
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/learnflow_ci
          SPRING_DATASOURCE_USERNAME: learnflow_ci
          SPRING_DATASOURCE_PASSWORD: learnflow_ci_password
          LEARNFLOW_JWT_SECRET: ci-only-0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          validation_log="${RUNNER_TEMP}/flyway-jpa-validation.log"
          java -jar target/learnflow-backend-0.0.1-SNAPSHOT.jar --spring.main.web-application-type=none > "${validation_log}" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "${app_pid}" 2>/dev/null || true
            wait "${app_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if grep -q "Started LearnFlowApplication" "${validation_log}"; then
              cat "${validation_log}"
              exit 0
            fi
            if ! kill -0 "${app_pid}" 2>/dev/null; then
              cat "${validation_log}"
              echo "Application exited before Flyway and JPA validation completed."
              exit 1
            fi
            sleep 1
          done
          cat "${validation_log}"
          echo "Timed out waiting for Flyway and JPA validation."
          exit 1
      - name: Verify OpenAPI compatibility contract
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/learnflow_ci
          SPRING_DATASOURCE_USERNAME: learnflow_ci
          SPRING_DATASOURCE_PASSWORD: learnflow_ci_password
          LEARNFLOW_JWT_SECRET: ci-only-0123456789abcdef0123456789abcdef
          LEARNFLOW_OPENAPI_ENABLED: "true"
        run: |
          java -jar target/learnflow-backend-0.0.1-SNAPSHOT.jar --server.port=18081 > ../openapi-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/v3/api-docs > ../openapi.json; then break; fi
            sleep 1
          done
          python ../tools/check_openapi_contract.py ../openapi.json ../docs/openapi/required-paths.txt

  agent:
    name: Agent / Python 3.12
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-platform
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agent-platform/requirements.txt
            agent-platform/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run reproducible RAG regression evaluation
        run: >-
          python -m app.evaluation.rag_runner
          --dataset-dir evals/rag/v1
          --splits regression
          --k 5
          --output "${{ runner.temp }}/learnflow-rag-regression.json"
      - name: Lint and type-check
        run: |
          python -m ruff check app tests ../tools/check_performance_assets.py ../tools/capture_capacity_snapshot.py ../tools/build_capacity_report.py ../tools/check_recovery_assets.py ../tools/build_recovery_report.py ../tools/tests
          python -m mypy app ../tools/check_performance_assets.py ../tools/capture_capacity_snapshot.py ../tools/build_capacity_report.py ../tools/check_recovery_assets.py ../tools/build_recovery_report.py
          python -m ruff check ../tools/release_evidence.py ../tools/check_release_candidate.py ../tools/check_data_governance_assets.py ../tools/build_data_governance_report.py
          python -m mypy ../tools/release_evidence.py ../tools/check_release_candidate.py ../tools/check_data_governance_assets.py ../tools/build_data_governance_report.py

  runtime-smoke:
    name: Runtime / hardened containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend
      - agent
      - frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate Compose model
        run: docker compose --profile observability config --quiet
      - name: Build hardened application images
        run: docker compose build backend agent frontend
      - name: Start the application stack and wait for readiness
        run: docker compose up -d --wait --wait-timeout 240 postgres agent backend frontend
      - name: Exercise public and internal health contracts
        run: |
          test "$(curl --fail --silent --show-error http://127.0.0.1/health/live)" = '{"status":"alive"}'
          test "$(curl --fail --silent --show-error http://127.0.0.1/health/ready)" = '{"status":"ready"}'
          curl --fail --silent --show-error http://127.0.0.1:18081/actuator/health/liveness
          curl --fail --silent --show-error http://127.0.0.1:18081/actuator/health/readiness
          docker compose exec -T agent python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"
      - name: Capture diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 postgres agent backend frontend
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Lint and unit test
        run: |
          npm run lint
          npm run test:unit
