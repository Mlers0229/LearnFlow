services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg15
    container_name: learnflow-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-learnflow}"
      POSTGRES_USER: "${POSTGRES_USER:-learnflow_owner}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_owner_password}"
      LEARNFLOW_MIGRATION_DB_PASSWORD: "${LEARNFLOW_MIGRATION_DB_PASSWORD:-change_migrator_password}"
      LEARNFLOW_BACKEND_DB_PASSWORD: "${LEARNFLOW_BACKEND_DB_PASSWORD:-change_backend_password}"
      LEARNFLOW_AGENT_DB_PASSWORD: "${LEARNFLOW_AGENT_DB_PASSWORD:-change_agent_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-learnflow-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: agent-platform/Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1,postgres,backend,agent,frontend}"
    container_name: learnflow-agent
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --timeout-graceful-shutdown
      - "${LEARNFLOW_AGENT_GRACEFUL_SHUTDOWN_TIMEOUT:-30}"
    environment:
      LEARNFLOW_DB_USER: "learnflow_agent"
      LEARNFLOW_DB_PASSWORD: "${LEARNFLOW_AGENT_DB_PASSWORD:-change_agent_password}"
      LEARNFLOW_DB_HOST: "postgres"
      LEARNFLOW_DB_PORT: "5432"
      LEARNFLOW_DB_NAME: "${POSTGRES_DB:-learnflow}"
      LLM_API_BASE: "${LLM_API_BASE:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_API_MODEL: "${LLM_API_MODEL:-deepseek-chat}"
      ENABLE_LLM_PLAN: "${ENABLE_LLM_PLAN:-true}"
      LEARNFLOW_INTERNAL_TOKEN: "${LEARNFLOW_AI_AGENT_INTERNAL_TOKEN:-dev-only-change-this-agent-token}"
      LEARNFLOW_INTERNAL_PREVIOUS_TOKEN: "${LEARNFLOW_AI_AGENT_PREVIOUS_INTERNAL_TOKEN:-}"
      LEARNFLOW_ENV: "${LEARNFLOW_ENV:-development}"
      LEARNFLOW_AGENT_LOG_MAX_PAYLOAD_BYTES: "${LEARNFLOW_AGENT_LOG_MAX_PAYLOAD_BYTES:-4096}"
      LEARNFLOW_AGENT_LOG_RETENTION_DAYS: "${LEARNFLOW_AGENT_LOG_RETENTION_DAYS:-30}"
      LEARNFLOW_LLM_ALLOWED_HOSTS: "${LEARNFLOW_LLM_ALLOWED_HOSTS:-}"
      LEARNFLOW_ALLOW_INSECURE_LLM_HTTP: "${LEARNFLOW_ALLOW_INSECURE_LLM_HTTP:-false}"
      LEARNFLOW_LLM_CONNECT_TIMEOUT: "${LEARNFLOW_LLM_CONNECT_TIMEOUT:-5}"
      LEARNFLOW_LLM_READ_TIMEOUT: "${LEARNFLOW_LLM_READ_TIMEOUT:-60}"
      LEARNFLOW_LLM_WRITE_TIMEOUT: "${LEARNFLOW_LLM_WRITE_TIMEOUT:-15}"
      LEARNFLOW_LLM_POOL_TIMEOUT: "${LEARNFLOW_LLM_POOL_TIMEOUT:-5}"
      LEARNFLOW_LLM_MAX_CONNECTIONS: "${LEARNFLOW_LLM_MAX_CONNECTIONS:-30}"
      LEARNFLOW_LLM_MAX_KEEPALIVE_CONNECTIONS: "${LEARNFLOW_LLM_MAX_KEEPALIVE_CONNECTIONS:-10}"
      LEARNFLOW_LLM_MAX_CONCURRENT_CALLS: "${LEARNFLOW_LLM_MAX_CONCURRENT_CALLS:-12}"
      LEARNFLOW_LLM_BULKHEAD_WAIT: "${LEARNFLOW_LLM_BULKHEAD_WAIT:-0.1}"
      LEARNFLOW_LLM_CIRCUIT_FAILURE_THRESHOLD: "${LEARNFLOW_LLM_CIRCUIT_FAILURE_THRESHOLD:-5}"
      LEARNFLOW_LLM_CIRCUIT_OPEN_SECONDS: "${LEARNFLOW_LLM_CIRCUIT_OPEN_SECONDS:-20}"
      LEARNFLOW_LLM_CIRCUIT_HALF_OPEN_CALLS: "${LEARNFLOW_LLM_CIRCUIT_HALF_OPEN_CALLS:-1}"
      LEARNFLOW_AGENT_DB_POOL_SIZE: "${LEARNFLOW_AGENT_DB_POOL_SIZE:-5}"
      LEARNFLOW_AGENT_DB_POOL_OVERFLOW: "${LEARNFLOW_AGENT_DB_POOL_OVERFLOW:-0}"
      LEARNFLOW_AGENT_DB_POOL_ACQUIRE_TIMEOUT: "${LEARNFLOW_AGENT_DB_POOL_ACQUIRE_TIMEOUT:-5}"
      LEARNFLOW_OTEL_ENABLED: "${LEARNFLOW_OTEL_ENABLED:-false}"
      LEARNFLOW_TRACE_SAMPLE_PROBABILITY: "${LEARNFLOW_TRACE_SAMPLE_PROBABILITY:-0.10}"
      LEARNFLOW_RELEASE_VERSION: "${LEARNFLOW_RELEASE_VERSION:-development}"
      LEARNFLOW_METRICS_EXPORT_INTERVAL_MS: "${LEARNFLOW_METRICS_EXPORT_INTERVAL_MS:-30000}"
      LEARNFLOW_LLM_INPUT_USD_PER_1M_TOKENS: "${LEARNFLOW_LLM_INPUT_USD_PER_1M_TOKENS:-0}"
      LEARNFLOW_LLM_OUTPUT_USD_PER_1M_TOKENS: "${LEARNFLOW_LLM_OUTPUT_USD_PER_1M_TOKENS:-0}"
      LEARNFLOW_EMBEDDING_ENABLED: "${LEARNFLOW_EMBEDDING_ENABLED:-false}"
      LEARNFLOW_EMBEDDING_PROVIDER: "${LEARNFLOW_EMBEDDING_PROVIDER:-openai-compatible}"
      LEARNFLOW_EMBEDDING_API_BASE: "${LEARNFLOW_EMBEDDING_API_BASE:-}"
      LEARNFLOW_EMBEDDING_API_KEY: "${LEARNFLOW_EMBEDDING_API_KEY:-}"
      LEARNFLOW_EMBEDDING_MODEL: "${LEARNFLOW_EMBEDDING_MODEL:-text-embedding-3-small}"
      LEARNFLOW_EMBEDDING_VERSION: "${LEARNFLOW_EMBEDDING_VERSION:-text-embedding-3-small-v1}"
      LEARNFLOW_EMBEDDING_DIMENSIONS: "${LEARNFLOW_EMBEDDING_DIMENSIONS:-1536}"
      LEARNFLOW_EMBEDDING_READ_TIMEOUT: "${LEARNFLOW_EMBEDDING_READ_TIMEOUT:-30}"
      LEARNFLOW_EMBEDDING_MAX_CONCURRENT_CALLS: "${LEARNFLOW_EMBEDDING_MAX_CONCURRENT_CALLS:-6}"
      LEARNFLOW_EMBEDDING_BULKHEAD_WAIT: "${LEARNFLOW_EMBEDDING_BULKHEAD_WAIT:-0.1}"
      LEARNFLOW_EMBEDDING_CIRCUIT_FAILURE_THRESHOLD: "${LEARNFLOW_EMBEDDING_CIRCUIT_FAILURE_THRESHOLD:-5}"
      LEARNFLOW_EMBEDDING_CIRCUIT_OPEN_SECONDS: "${LEARNFLOW_EMBEDDING_CIRCUIT_OPEN_SECONDS:-20}"
      LEARNFLOW_EMBEDDING_CIRCUIT_HALF_OPEN_CALLS: "${LEARNFLOW_EMBEDDING_CIRCUIT_HALF_OPEN_CALLS:-1}"
      OTEL_SERVICE_NAME: "learnflow-agent"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    stop_grace_period: 40s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MAVEN_MIRROR_URL: "${MAVEN_MIRROR_URL:-https://maven.aliyun.com/repository/public}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1,postgres,backend,agent,frontend}"
    container_name: learnflow-backend
    environment:
      SERVER_PORT: "18081"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-learnflow}"
      SPRING_DATASOURCE_USERNAME: "learnflow_backend"
      SPRING_DATASOURCE_PASSWORD: "${LEARNFLOW_BACKEND_DB_PASSWORD:-change_backend_password}"
      LEARNFLOW_MIGRATION_DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-learnflow}"
      LEARNFLOW_MIGRATION_DB_USER: "learnflow_migrator"
      LEARNFLOW_MIGRATION_DB_PASSWORD: "${LEARNFLOW_MIGRATION_DB_PASSWORD:-change_migrator_password}"
      LEARNFLOW_AI_AGENT_BASE_URL: "http://agent:8000"
      LEARNFLOW_AI_AGENT_INTERNAL_TOKEN: "${LEARNFLOW_AI_AGENT_INTERNAL_TOKEN:-dev-only-change-this-agent-token}"
      LEARNFLOW_JWT_SECRET: "${LEARNFLOW_JWT_SECRET:-dev-only-change-this-jwt-secret-32-bytes}"
      LEARNFLOW_JWT_KEY_ID: "${LEARNFLOW_JWT_KEY_ID:-current}"
      LEARNFLOW_JWT_PREVIOUS_SECRET: "${LEARNFLOW_JWT_PREVIOUS_SECRET:-}"
      LEARNFLOW_JWT_PREVIOUS_KEY_ID: "${LEARNFLOW_JWT_PREVIOUS_KEY_ID:-previous}"
      LEARNFLOW_SECURE_COOKIE: "${LEARNFLOW_SECURE_COOKIE:-true}"
      LEARNFLOW_CORS_ALLOWED_ORIGINS: "${LEARNFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}"
      LEARNFLOW_ENV: "${LEARNFLOW_ENV:-development}"
      FLYWAY_BASELINE_ON_MIGRATE: "${FLYWAY_BASELINE_ON_MIGRATE:-false}"
      LEARNFLOW_AUDIT_RETENTION: "${LEARNFLOW_AUDIT_RETENTION:-365d}"
      LEARNFLOW_AUDIT_MAX_DETAIL_LENGTH: "${LEARNFLOW_AUDIT_MAX_DETAIL_LENGTH:-2048}"
      LEARNFLOW_AUDIT_CLEANUP_CRON: "${LEARNFLOW_AUDIT_CLEANUP_CRON:-0 17 3 * * *}"
      LEARNFLOW_PASSWORD_RESET_ENABLED: "${LEARNFLOW_PASSWORD_RESET_ENABLED:-false}"
      LEARNFLOW_PASSWORD_RESET_TTL: "${LEARNFLOW_PASSWORD_RESET_TTL:-20m}"
      LEARNFLOW_PASSWORD_RESET_BASE_URL: "${LEARNFLOW_PASSWORD_RESET_BASE_URL:-http://localhost:5173/reset-password}"
      LEARNFLOW_PASSWORD_RESET_MAIL_FROM: "${LEARNFLOW_PASSWORD_RESET_MAIL_FROM:-no-reply@learnflow.local}"
      LEARNFLOW_PASSWORD_RESET_MAX_REQUESTS: "${LEARNFLOW_PASSWORD_RESET_MAX_REQUESTS:-3}"
      LEARNFLOW_PASSWORD_RESET_REQUEST_WINDOW: "${LEARNFLOW_PASSWORD_RESET_REQUEST_WINDOW:-30m}"
      SMTP_HOST: "${SMTP_HOST:-localhost}"
      SMTP_PORT: "${SMTP_PORT:-25}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_AUTH: "${SMTP_AUTH:-false}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-false}"
      LEARNFLOW_AI_CONNECT_TIMEOUT: "${LEARNFLOW_AI_CONNECT_TIMEOUT:-3s}"
      LEARNFLOW_AI_WRITE_TIMEOUT: "${LEARNFLOW_AI_WRITE_TIMEOUT:-15s}"
      LEARNFLOW_AI_READ_TIMEOUT: "${LEARNFLOW_AI_READ_TIMEOUT:-60s}"
      LEARNFLOW_AI_ADMIN_BUDGET: "${LEARNFLOW_AI_ADMIN_BUDGET:-10s}"
      LEARNFLOW_AI_RAG_BUDGET: "${LEARNFLOW_AI_RAG_BUDGET:-15s}"
      LEARNFLOW_AI_TUTOR_BUDGET: "${LEARNFLOW_AI_TUTOR_BUDGET:-45s}"
      LEARNFLOW_AI_PLAN_BUDGET: "${LEARNFLOW_AI_PLAN_BUDGET:-90s}"
      LEARNFLOW_AI_STREAM_BUDGET: "${LEARNFLOW_AI_STREAM_BUDGET:-5m}"
      LEARNFLOW_AI_STREAM_IDLE_TIMEOUT: "${LEARNFLOW_AI_STREAM_IDLE_TIMEOUT:-60s}"
      LEARNFLOW_AI_MAX_CONNECTIONS: "${LEARNFLOW_AI_MAX_CONNECTIONS:-30}"
      LEARNFLOW_AI_MAX_IDLE_CONNECTIONS: "${LEARNFLOW_AI_MAX_IDLE_CONNECTIONS:-10}"
      LEARNFLOW_AI_RETRY_MAX_ATTEMPTS: "${LEARNFLOW_AI_RETRY_MAX_ATTEMPTS:-2}"
      LEARNFLOW_AI_RETRY_WAIT: "${LEARNFLOW_AI_RETRY_WAIT:-100ms}"
      LEARNFLOW_AI_CIRCUIT_FAILURE_RATE: "${LEARNFLOW_AI_CIRCUIT_FAILURE_RATE:-50}"
      LEARNFLOW_AI_CIRCUIT_MINIMUM_CALLS: "${LEARNFLOW_AI_CIRCUIT_MINIMUM_CALLS:-5}"
      LEARNFLOW_AI_CIRCUIT_OPEN_WAIT: "${LEARNFLOW_AI_CIRCUIT_OPEN_WAIT:-20s}"
      LEARNFLOW_AI_CIRCUIT_HALF_OPEN_CALLS: "${LEARNFLOW_AI_CIRCUIT_HALF_OPEN_CALLS:-2}"
      LEARNFLOW_AI_BULKHEAD_WAIT: "${LEARNFLOW_AI_BULKHEAD_WAIT:-0ms}"
      LEARNFLOW_AI_ADMIN_CONCURRENCY: "${LEARNFLOW_AI_ADMIN_CONCURRENCY:-4}"
      LEARNFLOW_AI_RAG_CONCURRENCY: "${LEARNFLOW_AI_RAG_CONCURRENCY:-8}"
      LEARNFLOW_AI_TUTOR_CONCURRENCY: "${LEARNFLOW_AI_TUTOR_CONCURRENCY:-8}"
      LEARNFLOW_AI_PLAN_CONCURRENCY: "${LEARNFLOW_AI_PLAN_CONCURRENCY:-4}"
      LEARNFLOW_AI_STREAM_CONCURRENCY: "${LEARNFLOW_AI_STREAM_CONCURRENCY:-6}"
      LEARNFLOW_BACKEND_DB_POOL_SIZE: "${LEARNFLOW_BACKEND_DB_POOL_SIZE:-15}"
      LEARNFLOW_BACKEND_DB_POOL_MIN_IDLE: "${LEARNFLOW_BACKEND_DB_POOL_MIN_IDLE:-2}"
      LEARNFLOW_BACKEND_DB_POOL_ACQUIRE_TIMEOUT: "${LEARNFLOW_BACKEND_DB_POOL_ACQUIRE_TIMEOUT:-3000}"
      LEARNFLOW_SHUTDOWN_TIMEOUT: "${LEARNFLOW_SHUTDOWN_TIMEOUT:-30s}"
      LEARNFLOW_TASKS_ENABLED: "${LEARNFLOW_TASKS_ENABLED:-true}"
      LEARNFLOW_TASKS_CONCURRENCY: "${LEARNFLOW_TASKS_CONCURRENCY:-2}"
      LEARNFLOW_TASKS_MAX_ATTEMPTS: "${LEARNFLOW_TASKS_MAX_ATTEMPTS:-3}"
      LEARNFLOW_TASKS_LEASE_DURATION: "${LEARNFLOW_TASKS_LEASE_DURATION:-3m}"
      LEARNFLOW_TASKS_TIMEOUT: "${LEARNFLOW_TASKS_TIMEOUT:-10m}"
      LEARNFLOW_TASKS_RETRY_BASE_DELAY: "${LEARNFLOW_TASKS_RETRY_BASE_DELAY:-5s}"
      LEARNFLOW_TASKS_FAILED_PAYLOAD_RETENTION: "${LEARNFLOW_TASKS_FAILED_PAYLOAD_RETENTION:-7d}"
      LEARNFLOW_TASKS_FAILED_PAGE_SIZE: "${LEARNFLOW_TASKS_FAILED_PAGE_SIZE:-50}"
      LEARNFLOW_TASKS_CLEANUP_CRON: "${LEARNFLOW_TASKS_CLEANUP_CRON:-0 41 3 * * *}"
      LEARNFLOW_RESOURCE_INGESTION_ENABLED: "${LEARNFLOW_RESOURCE_INGESTION_ENABLED:-true}"
      LEARNFLOW_RESOURCE_MAX_SOURCE_BYTES: "${LEARNFLOW_RESOURCE_MAX_SOURCE_BYTES:-10485760}"
      LEARNFLOW_RESOURCE_MAX_EXTRACTED_CHARACTERS: "${LEARNFLOW_RESOURCE_MAX_EXTRACTED_CHARACTERS:-2000000}"
      LEARNFLOW_RESOURCE_STORAGE_TYPE: "${LEARNFLOW_RESOURCE_STORAGE_TYPE:-filesystem}"
      LEARNFLOW_RESOURCE_STORAGE_PATH: "${LEARNFLOW_RESOURCE_STORAGE_PATH:-/var/lib/learnflow/resource-sources}"
      LEARNFLOW_RESOURCE_STORAGE_BUCKET: "${LEARNFLOW_RESOURCE_STORAGE_BUCKET:-}"
      LEARNFLOW_RESOURCE_STORAGE_REGION: "${LEARNFLOW_RESOURCE_STORAGE_REGION:-us-east-1}"
      LEARNFLOW_RESOURCE_STORAGE_ENDPOINT: "${LEARNFLOW_RESOURCE_STORAGE_ENDPOINT:-}"
      LEARNFLOW_RESOURCE_STORAGE_PREFIX: "${LEARNFLOW_RESOURCE_STORAGE_PREFIX:-learnflow}"
      LEARNFLOW_EMBEDDING_ENABLED: "${LEARNFLOW_EMBEDDING_ENABLED:-false}"
      LEARNFLOW_EMBEDDING_PROVIDER: "${LEARNFLOW_EMBEDDING_PROVIDER:-openai-compatible}"
      LEARNFLOW_EMBEDDING_MODEL: "${LEARNFLOW_EMBEDDING_MODEL:-text-embedding-3-small}"
      LEARNFLOW_EMBEDDING_VERSION: "${LEARNFLOW_EMBEDDING_VERSION:-text-embedding-3-small-v1}"
      LEARNFLOW_EMBEDDING_DIMENSIONS: "${LEARNFLOW_EMBEDDING_DIMENSIONS:-1536}"
      LEARNFLOW_EMBEDDING_BATCH_SIZE: "${LEARNFLOW_EMBEDDING_BATCH_SIZE:-32}"
      LEARNFLOW_EMBEDDING_BACKFILL_PAGE_SIZE: "${LEARNFLOW_EMBEDDING_BACKFILL_PAGE_SIZE:-20}"
      LEARNFLOW_EMBEDDING_BACKFILL_INTERVAL_MS: "${LEARNFLOW_EMBEDDING_BACKFILL_INTERVAL_MS:-30000}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      LEARNFLOW_OTEL_ENABLED: "${LEARNFLOW_OTEL_ENABLED:-false}"
      LEARNFLOW_TRACE_SAMPLE_PROBABILITY: "${LEARNFLOW_TRACE_SAMPLE_PROBABILITY:-0.10}"
      LEARNFLOW_RELEASE_VERSION: "${LEARNFLOW_RELEASE_VERSION:-development}"
      LEARNFLOW_METRICS_EXPORT_STEP: "${LEARNFLOW_METRICS_EXPORT_STEP:-30s}"
      OTEL_SERVICE_NAME: "learnflow-backend"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}"
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
    expose:
      - "18081"
    ports:
      - "${BACKEND_PORT:-18081}:18081"
    volumes:
      - resource_source_data:/var/lib/learnflow/resource-sources
    restart: unless-stopped
    stop_grace_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1,postgres,backend,agent,frontend}"
    container_name: learnflow-frontend
    depends_on:
      backend:
        condition: service_started
      agent:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: learnflow-jaeger
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.134.0
    container_name: learnflow-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./ops/observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_PROMETHEUS_PORT:-9464}:9464"
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: learnflow-alertmanager
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: learnflow-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_started
      alertmanager:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    container_name: learnflow-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-learnflow_admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change_grafana_password}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  resource_source_data:
  alertmanager_data:
  prometheus_data:
  grafana_data:
