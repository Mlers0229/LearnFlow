[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = "(^|/)(venv|\\.venv)/"
